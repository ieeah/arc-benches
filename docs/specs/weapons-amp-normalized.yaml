weapons:
  anvil:
    required_module: amplification-module-mk-iii
    branches:
      branch-anvil-x-rounds:
        name: "X Rounds"
        blocks: [branch-anvil-splitter]
        nodes:
          node-anvil-x-rounds:
            name: "X Rounds"
            desc: "Aumenta danno base e penetrazione contro armatura ARC a scapito di rinculo, velocità proiettile e moltiplicatore headshot."
            reqs:
              - type: quest
                id: light-impact-grenade-task
                state: completed
                desc: "Infliggi 1.000 danni ciascuno con Light Impact Grenades a Hornet, Firefly, Surveyor e Fireball"
              - type: currency
                id: research-points
                qty: 5000
                desc: "Paga 5.000 Punti Ricerca"
              - type: mat
                id: rocketeer-part
                qty: 5
                desc: "Consegna 5x Rocketeer Driver"
              - type: mat
                id: fossilized-lightning
                qty: 3
                desc: "Installa 3x Fossilized Lightning"
            effects:
              base_damage: +5
              arc_armor_damage_pct: +33
              arc_armor_penetration: "Very Strong"
              headshot_multiplier_pct: -10
              recoil: "Increased"
              bullet_velocity_pct: -50
      branch-anvil-splitter:
        name: "Splitter"
        blocks: [branch-anvil-x-rounds]
        nodes:
          node-anvil-splitter:
            name: "Anvil Splitter"
            desc: "Divide ogni colpo in 4 proiettili infliggendo complessivamente più danno se tutti i colpi vanno a segno, ma peggiora headshot e dispersione ADS."
            # reqs non indicati: costo di montaggio non noto (non è gratuito, non è indicato)
            effects:
              projectiles_per_shot: 4
              damage_per_projectile_pct: -70
              headshot_multiplier_pct: -40
              ads_spread: "Increased"

  il-toro:
    required_module: amplification-module-mk-ii
    branches:
      branch-il-toro-slug:
        name: "Slug Rounds"
        nodes:
          node-il-toro-slug-rounds:
            name: "Slug Rounds"
            desc: "Spara un singolo proiettile slug invece di una rosata di pallettoni, incrementando notevolmente il danno ad armatura ARC."
            reqs:
              - type: quest
                id: shotgun-flying-arc-task
                state: completed
                desc: "Distruggi 50 ARC volanti con shotgun"
              - type: currency
                id: research-points
                qty: 5000
                desc: "Paga 5.000 Punti Ricerca"
              - type: mat
                id: tick-pod
                qty: 20
                desc: "Consegna 20x Tick Pod"
              - type: mat
                id: turbine-compressor
                qty: 4
                desc: "Installa 4x Turbine Compressor"
            effects:
              firing_type: slug
              damage_multiplier_vs_pellet: 10
              arc_armor_damage_pct: +200
              spread_pct: -40
              bullet_velocity_pct: -50
      branch-il-toro-reload:
        name: "Reload"
        nodes:
          node-il-toro-more-reload:
            name: "More Reload"
            desc: "Carica una cartuccia aggiuntiva per ciclo di ricarica."
            reqs:
              - type: mat
                id: propellant-valve-assembly
                qty: 2
                desc: "Installa 2x Propellant Valve Assembly"
            effects:
              shells_loaded_per_cycle: +1

  rattler:
    required_module: amplification-module-mk-i
    branches:
      branch-rattler-reload:
        name: "Reload"
        nodes:
          node-rattler-more-reload:
            name: "More Reload"
            desc: "Carica 4 colpi alla volta invece di 2."
            reqs:
              - type: mat
                id: propellant-valve-assembly
                qty: 2
                desc: "Installa 2x Propellant Valve Assembly"
            effects:
              rounds_loaded_per_cycle: +2
      branch-rattler-capacity:
        name: "Drum Mag"
        nodes:
          node-rattler-drum-mag:
            name: "Drum Mag"
            desc: "Aumenta la capienza del caricatore a 64 colpi a scapito di rinculo, dispersione e velocità di mira."
            reqs:
              - type: quest
                id: rattler-bastion-task
                state: completed
                desc: "Infliggi 15.000 danni ai Bastion con Rattler e uccidine 1"
              - type: currency
                id: research-points
                qty: 5000
                desc: "Paga 5.000 Punti Ricerca"
              - type: mat
                id: pressure-regulator
                qty: 4
                desc: "Installa 4x Pressure Regulator"
            effects:
              magazine_size: +40
              recoil: "Increased"
              spread: "Increased"
              ads_speed_pct: -10
      branch-rattler-incendiary:
        name: "Incendiary Rounds"
        nodes:
          node-rattler-incendiary-rounds:
            name: "Incendiary Rounds"
            desc: "I colpi incendiano i bersagli provocando danno continuo da bruciatura."
            reqs:
              - type: quest
                id: fireball-explosive-mines-task
                state: completed
                desc: "Uccidi 30 Fireball con mine esplosive"
              - type: currency
                id: research-points
                qty: 5000
                desc: "Paga 5.000 Punti Ricerca"
              - type: mat
                id: fossilized-lightning
                qty: 3
                desc: "Installa 3x Fossilized Lightning"
            effects:
              burn_damage_per_second: 5
              burn_duration_seconds: +2

  burletta:
    required_module: amplification-module-mk-ii
    branches:
      branch-burletta-auto:
        name: "Full Auto"
        blocks: [branch-burletta-burst]
        nodes:
          node-burletta-full-auto:
            name: "Full Auto"
            desc: "Converte l'arma in completamente automatica incrementando la cadenza a spese di danno, stabilità e moltiplicatore headshot."
            reqs:
              - type: mat
                id: pneumatic-actuator
                qty: 3
                desc: "Installa 3x Pneumatic Actuator"
            effects:
              firing_mode: full_auto
              base_damage: -2
              fire_rate: +20
              stability: -30
              headshot_multiplier_pct: -60
      branch-burletta-burst:
        name: "Burst"
        blocks: [branch-burletta-auto]
        nodes:
          node-burletta-burst-fire:
            name: "Burst Fire"
            desc: "Imposta il tiro a raffica."
            reqs:
              - type: quest
                id: shredders-raider-tool-task
                state: completed
                desc: "Distruggi 3 Shredder con il Raider Tool"
              - type: currency
                id: research-points
                qty: 5000
                desc: "Paga 5.000 Punti Ricerca"
              - type: mat
                id: queen-reactor
                qty: 2
                desc: "Installa 2x Queen Reactor"
            effects:
              firing_mode: burst
          node-burletta-increased-burst:
            name: "Increased Burst"
            desc: "Incrementa la dimensione della raffica e la capienza del caricatore."
            requires: [node-burletta-burst-fire]
            reqs:
              - type: quest
                id: burst-damage-task
                state: completed
                desc: "Infliggi 10.000 danni con Burletta a raffica o Charged Burst"
              - type: currency
                id: research-points
                qty: 5000
                desc: "Paga 5.000 Punti Ricerca"
              - type: mat
                id: pressure-regulator
                qty: 2
                desc: "Installa 2x Pressure Regulator"
            effects:
              burst_count: +2
              magazine_size: +3
      branch-burletta-mobility:
        name: "Sprint Shooting"
        nodes:
          node-burletta-sprint-shooting:
            name: "Sprint Shooting"
            desc: "Abilita la possibilità di fare fuoco durante lo scatto."
            reqs:
              - type: quest
                id: pass-exploration-task
                state: completed
                desc: "Visita 7 luoghi su Pass in una singola incursione (inclusi Commissary, Supermarket e Altamera Station)"
              - type: currency
                id: research-points
                qty: 5000
                desc: "Paga 5.000 Punti Ricerca"
              - type: mat
                id: fluted-rotor-core
                qty: 4
                desc: "Installa 4x Fluted Rotor Core"
            effects:
              allow_sprint_fire: true

  kettle:
    required_module: amplification-module-mk-i
